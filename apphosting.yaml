# Firebase App Hosting — configuration du backend.
#
# Déclarer les variables ici plutôt que dans la console les met sous
# contrôle de version : on voit dans le dépôt ce dont le site a besoin, et
# une valeur mal saisie se corrige par un commit plutôt qu'à l'aveugle.
#
# Les valeurs sensibles ne s'écrivent pas dans ce fichier : elles vivent
# dans Secret Manager et sont référencées par leur nom (`secret:`).
#   firebase apphosting:secrets:set NOM_DU_SECRET
#   firebase apphosting:secrets:grantaccess NOM_DU_SECRET --backend <backend>

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Base des URL canoniques, du sitemap et des images de partage.
  # Le protocole est obligatoire. Doit pointer sur le domaine servi — celui
  # vers lequel l'autre forme (avec ou sans www) redirige en 301.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://sagaconsultants.ca
    availability:
      - BUILD
      - RUNTIME

  # --- Secrets ------------------------------------------------------------
  # Décommenter au fur et à mesure, après avoir créé chaque secret. Une
  # référence vers un secret inexistant fait échouer le déploiement.
  #
  # Firebase admin : lecture des projets, écriture des demandes de contact,
  # téléversement des visuels. Disponible aussi au BUILD pour que le sitemap
  # et les pages prégénérées reflètent la base plutôt que le jeu statique.
  #
  # - variable: FIREBASE_PROJECT_ID
  #   value: saga-consultants
  #   availability: [BUILD, RUNTIME]
  # - variable: FIREBASE_CLIENT_EMAIL
  #   secret: firebase-client-email
  #   availability: [BUILD, RUNTIME]
  # - variable: FIREBASE_PRIVATE_KEY
  #   secret: firebase-private-key
  #   availability: [BUILD, RUNTIME]
  #
  # SendGrid : sans ces valeurs, le formulaire de contact enregistre la
  # demande dans Firestore mais n'envoie aucun courriel.
  #
  # - variable: SENDGRID_API_KEY
  #   secret: sendgrid-api-key
  #   availability: [RUNTIME]
  # - variable: SENDGRID_FROM_EMAIL
  #   value: noreply@sagaconsultants.ca
  #   availability: [RUNTIME]
  # - variable: CONTACT_TO_EMAIL
  #   value: info@sagaconsultants.ca
  #   availability: [RUNTIME]
  #
  # Espace privé : sans mot de passe, /admin reste inaccessible.
  #
  # - variable: ADMIN_PASSWORD
  #   secret: admin-password
  #   availability: [RUNTIME]
  # - variable: ADMIN_SESSION_SECRET
  #   secret: admin-session-secret
  #   availability: [RUNTIME]
